name: XboxRemote
options:
  bundleIdPrefix: com.example
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # 在这里填你的 Apple 开发者 Team ID（Xcode > Settings > Accounts 里能看到），
    # 或者生成工程后在 Xcode 的 Signing & Capabilities 里选择。
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    PRODUCT_NAME: XboxRemote
    PRODUCT_MODULE_NAME: XboxRemote
    ENABLE_PREVIEWS: YES

packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    from: "125.0.0"

targets:
  XboxRemote-iOS:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
        excludes:
          - "Info.plist"
    dependencies:
      - package: WebRTC
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Xbox Remote
        CFBundleLocalizations: [zh-Hans, en]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
        NSPhotoLibraryAddUsageDescription: 用于把串流截图保存到相册。
        NSMicrophoneUsageDescription: 仅在你开启语音聊天时使用麦克风。
        NSLocalNetworkUsageDescription: 用于在局域网内直接连接你的 Xbox 主机，获得更低的延迟。
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.xboxremote
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  XboxRemote-macOS:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: macOS
        excludes:
          - "Info.plist"
          - "XboxRemote.entitlements"
    dependencies:
      - package: WebRTC
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: Xbox Remote
        CFBundleLocalizations: [zh-Hans, en]
        LSApplicationCategoryType: public.app-category.games
        GCSupportsControllerUserInteraction: true
        NSBluetoothAlwaysUsageDescription: 用于连接蓝牙游戏手柄。
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: macOS/XboxRemote.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.device.bluetooth: true
        com.apple.security.device.usb: true
        com.apple.security.assets.pictures.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.xboxremote.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES

  XboxRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: XboxRemote-iOS
    settings:
      base:
        PRODUCT_NAME: XboxRemoteTests
        PRODUCT_MODULE_NAME: XboxRemoteTests
        PRODUCT_BUNDLE_IDENTIFIER: com.example.xboxremote.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/XboxRemote.app/XboxRemote"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  XboxRemote-iOS:
    build:
      targets:
        XboxRemote-iOS: all
        XboxRemoteTests: [test]
    test:
      targets:
        - XboxRemoteTests
  XboxRemote-macOS:
    build:
      targets:
        XboxRemote-macOS: all
